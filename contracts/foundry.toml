[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 800
# Paris avoids PUSH0/Cancun-only opcodes: safe on Robinhood Chain (Arbitrum stack) regardless of ArbOS version.
evm_version = "paris"
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
  "solady/=lib/solady/src/",
]

[fuzz]
runs = 1024

[invariant]
runs = 128
depth = 64
fail_on_revert = false

[rpc_endpoints]
robinhood = "https://rpc.ordofi.network"
robinhood_testnet = "https://robinhood-sepolia-rpc.publicnode.com"

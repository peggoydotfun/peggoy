# /etc/nginx/sites-available/peggoy — __DOMAIN__ -> static site in /var/www/peggoy
# Strict CSP and no framing (gaps seen in the NIMORI review). The read-only RPC proxy for the Machine page
# ships with the app (a small Node service: method allowlist, per-IP rate limit, 5 s cache) and is mounted here
# as `location = /rpc { proxy_pass http://127.0.0.1:8787; }` once it exists.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;
    root /var/www/peggoy;
    index index.html;
    client_max_body_size 8k;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml model/gltf-binary;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' blob: https://cdn.jsdelivr.net https://rpc.ordofi.network https://robinhood-rpc.publicnode.com https://robinhood-sepolia-rpc.publicnode.com https://api.drand.sh; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;

    location ~* \.glb$ {
        types { model/gltf-binary glb; }
        expires 7d;
    }
    location /assets/ {
        expires 7d;
    }
    location = /index.html { expires epoch; }  # expires keeps the server-level security headers (add_header here would drop them)
    location = /deployments.json { expires epoch; }
    location ~* \.(js|css)$ { expires epoch; }  # revalidate (ETag): module imports are not cache-busted

    error_page 404 /404.html;
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
